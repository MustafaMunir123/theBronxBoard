<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latest Bronx News</title>
    <style>
        /* styles.css */

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
        }

        header {
            background: #35424a;
            color: #ffffff;
            padding: 20px 0;
            text-align: center;
        }

        h1 {
            margin: 0;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .news-card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.2s;
        }

        .news-card:hover {
            transform: scale(1.05);
        }

        .news-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .news-title {
            font-size: 1.5em;
            margin: 10px;
        }

        .news-title a {
            text-decoration: none;
            color: #35424a;
        }

        .news-title a:hover {
            text-decoration: underline;
        }

        .news-snippet {
            margin: 10px;
            color: #555;
        }

        .news-meta {
            margin: 10px;
            font-size: 0.9em;
            color: #777;
        }

        .news-source {
            margin: 10px;
            font-size: 0.9em;
            color: #777;
        }

        footer {
            text-align: center;
            padding: 20px 0;
            background: #35424a;
            color: #ffffff;
            position: relative;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Latest Bronx News</h1>
        </header>
        <main>
            <div class="news-grid">
                {% for article in news %}
                    <div class="news-card">
                        <img src="{{ article.image_url }}" alt="{{ article.title }}" class="news-image">
                        <h2 class="news-title"><a href="{{ article.url }}">{{ article.title }}</a></h2>
                        <p class="news-snippet">{{ article.snippet }}</p>
                        <p class="news-meta"><strong>Published at:</strong> {{ article.published_at }}</p>
                        <p class="news-source"><strong>Source:</strong> {{ article.source }}</p>
                    </div>
                {% endfor %}
            </div>
        </main>
        <footer>
            <p>&copy; 2023 Bronx News. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
