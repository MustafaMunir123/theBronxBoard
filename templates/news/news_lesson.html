<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    .container {
      background: #ffffff;
      margin: 20px auto;
      padding: 20px;
      max-width: 600px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .header {
      text-align: center;
      background-color: #2c3e50;
      color: white;
      padding: 15px;
      border-radius: 10px 10px 0 0;
    }
    .news-image img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 15px;
    }
    .news-title {
      font-size: 22px;
      color: #2c3e50;
      margin-top: 15px;
    }
    .description {
      color: #555;
      margin-top: 10px;
    }
    .lesson-box {
      background-color: #ecf0f1;
      padding: 15px;
      margin-top: 20px;
      border-left: 5px solid #3498db;
    }
    .lesson-title {
      font-weight: bold;
      margin-bottom: 10px;
      color: #2980b9;
    }
    .read-more {
      margin-top: 15px;
      text-align: center;
    }
    .read-more a {
      background-color: #3498db;
      color: white;
      padding: 10px 15px;
      text-decoration: none;
      border-radius: 5px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      📰 Student News & Life Lessons
    </div>

    <div class="news-image">
      {% if image_url %}
        <img src="{{ image_url }}" alt="News Image">
      {% endif %}
    </div>

    <div class="news-title">{{ title }}</div>
    <div class="description">{{ description }}</div>
    
    <div class="lesson-box">
      <div class="lesson-title">What Can We Learn?</div>
      <div>{{ lesson }}</div>
    </div>

    <div class="read-more">
      <a href="{{ url }}" target="_blank">🔗 Read Full Article</a>
    </div>
  </div>
</body>
</html>
